<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Network Jitter</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div>
        <div class="kicker">Sampler</div>
        <h1>Network Jitter</h1>
      </div>
      <label class="switch" title="Start or stop sampling">
        <input id="toggle" type="checkbox" />
        <i></i>
      </label>
    </header>

    <p id="status" class="status">Idle</p>
    <p id="error" class="error" hidden></p>

    <section id="targets" class="targets"></section>

    <footer>
      <button id="dashboard" class="btn primary" type="button">Open dashboard</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
